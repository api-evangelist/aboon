name: Aboon
description: 'Aboon is a digital 401(k) retirement-plan platform and third-party administrator (TPA) that
  helps financial advisors and employers design, launch, and manage workplace retirement plans. It pairs
  AI-powered workflows with dedicated human plan consultants to generate customized 401(k) proposals in
  minutes, streamline recordkeeper onboarding, handle digital plan contracting and census intake, and run
  ongoing compliance testing and Form 3(16) administration. Aboon markets partnerships with major recordkeepers
  (American Funds, Empower, John Hancock, and others) and serves a network of advisors nationwide. It is a
  fintech company backed by Bain Capital Ventures. No public developer/API surface has been identified.'
